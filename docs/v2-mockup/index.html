  <style>
:root {
  --bg: #f4f1e8;
  --ink: #1b241c;
  --muted: #5a635a;
  --card: #fffdf8;
  --line: #e0d8c8;
  --green: #1b6b48;
  --green-soft: #e7f4ec;
  --amber: #8a5a10;
  --amber-soft: #f7eed6;
  --red: #9a2e2e;
  --red-soft: #f8e7e7;
  --blue: #245e7a;
  --blue-soft: #e7f1f6;
  --chip: #efe8d8;
  --header: #163524;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Libre Franklin", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
}
header.app {
  background: var(--header);
  color: #f6f3eb;
  padding: 18px 20px 0;
}
header.app .wrap, main, footer, .tabbar .inner { max-width: 1180px; margin: 0 auto; }
header.app .wrap { position: relative; }
header.app h1 {
  font-family: "Source Serif 4", Georgia, serif;
  font-weight: 600;
  font-size: clamp(26px, 4vw, 38px);
  margin: 8px 0 8px;
  letter-spacing: -0.02em;
}
header.app .lede { margin: 0 0 12px; color: #d7e3d9; max-width: 80ch; }
.kicker { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #b7cfc0; }
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 999px;
  vertical-align: middle;
}
.badge.mock { background: #f0d48a; color: #4a3500; }
.badge.sample { background: #f3d27a; color: #4a3500; }
.badge.real { background: var(--green-soft); color: var(--green); }
.badge.prelim { background: var(--blue-soft); color: var(--blue); }
.badge.free { background: var(--green-soft); color: var(--green); }
.badge.paid { background: var(--amber-soft); color: var(--amber); }
.badge.partial { background: var(--blue-soft); color: var(--blue); }
.badge.procurement, .badge.needs { background: #efe4f4; color: #5a2e7a; }
.badge.yes { background: var(--green-soft); color: var(--green); }
.badge.no { background: var(--red-soft); color: var(--red); }
.langsw {
  position: absolute; top: 0; right: 0;
  display: inline-flex;
  border: 1px solid rgba(255,255,255,0.55);
  border-radius: 999px; overflow: hidden;
}
.langsw button {
  background: transparent; color: #d7e3d9; border: 0;
  padding: 5px 12px; font: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer; min-width: 44px;
}
.langsw button.on { background: #fff; color: #1b6b48; }
.fxstrip {
  display: flex; flex-wrap: wrap; gap: 10px 18px;
  align-items: baseline;
  background: rgba(0,0,0,0.18);
  margin: 8px 0 0;
  padding: 10px 14px;
  border-radius: 10px 10px 0 0;
  color: #e8f0ea;
  font-size: 14px;
}
.fxstrip .fxv {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 22px; font-weight: 600;
}
.fxstrip a { color: #cfe3d5; }
.tabbar {
  position: sticky; top: 0; z-index: 20;
  background: #10281b;
  border-bottom: 1px solid #2a4a36;
}
.tabbar .inner { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 20px; }
.tabbar button {
  background: transparent; color: #cfe3d5; border: 0;
  font: inherit; font-size: 14px; font-weight: 600;
  padding: 8px 14px; border-radius: 999px; cursor: pointer;
}
.tabbar button.on { background: #fff; color: var(--header); }
main { padding: 20px 20px 64px; }
h2 {
  font-family: "Source Serif 4", Georgia, serif;
  font-weight: 600; font-size: 26px; margin: 0 0 8px;
}
h3 { font-size: 16px; margin: 0 0 6px; font-weight: 650; }
.lead { color: var(--muted); margin: 0 0 16px; max-width: 85ch; }
.sample-banner, .callout, .card, .cwcard, .upload, .methodbox {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
}
.sample-banner {
  background: #fff4cc; border-color: #e6c96a; color: #4a3500;
  padding: 12px 14px; margin: 0 0 18px; font-size: 14px;
}
.callout { padding: 16px 18px; margin: 0 0 18px; border-left: 5px solid var(--blue); }
.callout.carton { border-left-color: #8a5a10; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 12px;
  margin: 0 0 22px;
}
.cwcard { padding: 14px 14px 12px; cursor: pointer; position: relative; }
.cwcard:hover { border-color: #c8bda8; }
.cwcard.on { outline: 2px solid var(--header); border-color: var(--header); }
.cwcard .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.cwcard h3 { font-size: 15px; margin: 0 0 4px; font-weight: 650; line-height: 1.3; }
.cwcard .now {
  font-family: "Source Serif 4", Georgia, serif;
  font-size: 26px; font-weight: 600; line-height: 1.1; color: var(--header);
}
.cwcard .when, .cwcard .src { font-size: 12px; color: var(--muted); }
.cwcard .src a { color: var(--blue); }
.cwcard .chg { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; margin: 6px 0 4px; }
.up { color: var(--red); }
.down { color: var(--green); }
.flat { color: var(--muted); }
.spark { position: relative; height: 64px; margin: 6px 0 0; }
.flags { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 6px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
.toolbar[hidden], [hidden] { display: none !important; }
.toolbar button, .rangebar button, .morebtn, .upload button {
  border: 1px solid var(--line); background: var(--card);
  border-radius: 999px; padding: 5px 12px; cursor: pointer;
  font: inherit; font-size: 13px;
}
.toolbar button.on, .rangebar button.on { background: var(--header); color: #f6f3eb; border-color: var(--header); }
.detail {
  display: grid;
  grid-template-columns: 1.4fr 0.8fr;
  gap: 14px;
  margin: 8px 0 28px;
}
@media (max-width: 900px) { .detail { grid-template-columns: 1fr; } }
.chartbox, .methodbox { padding: 16px; }
.chartbox { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.bigchart { position: relative; height: 340px; }
@media (max-width: 600px) { .bigchart { height: 280px; } header.app .kicker { padding-right: 104px; } }
.methodbox .caveat {
  background: var(--amber-soft); color: var(--amber);
  border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-top: 10px;
}
.src { font-size: 12px; color: var(--muted); }
.src a { color: var(--blue); text-underline-offset: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--card); border-radius: 14px; overflow: hidden; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-weight: 600; background: #f7f3ea; }
.tablewrap { overflow-x: auto; margin: 0 0 22px; border: 1px solid var(--line); border-radius: 14px; }
.upload { padding: 16px; margin: 0 0 22px; }
.upload textarea, .upload input[type=text] {
  width: 100%; font: inherit; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 10px; background: #fff;
}
.upload textarea { min-height: 90px; resize: vertical; }
.upload .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
@media (max-width: 700px) { .upload .row { grid-template-columns: 1fr; } }
.drop {
  border: 1.5px dashed #c8bda8; border-radius: 12px; padding: 18px;
  text-align: center; color: var(--muted); background: #fbfaf4; margin: 8px 0;
}
.muted { color: var(--muted); font-size: 13px; }
footer { padding: 24px 20px 48px; color: var(--muted); font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 16px; font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.legend i { display: inline-block; width: 18px; height: 3px; margin-right: 6px; vertical-align: middle; }
.legend i.hist { background: #163524; }
.legend i.fut { background: #245e7a; border-top: 0; height: 0; border-bottom: 2px dashed #245e7a; }
.legend i.ext { background: transparent; border-bottom: 2px dashed #8a8a8a; height: 0; }
.legend i.band { background: rgba(36,94,122,0.25); height: 8px; border-radius: 2px; }
.nodaily {
  background: var(--blue-soft); color: var(--blue);
  border-radius: 10px; padding: 12px; margin: 8px 0; font-size: 14px;
}
html[lang="th"] body, html[lang="th"] button, html[lang="th"] select, html[lang="th"] table, html[lang="th"] textarea, html[lang="th"] input {
  font-family: "Sarabun", "Noto Sans Thai", "Libre Franklin", system-ui, sans-serif;
}
html[lang="th"] h1, html[lang="th"] h2, html[lang="th"] h3, html[lang="th"] .now, html[lang="th"] .fxv {
  font-family: "Sarabun", "Noto Sans Thai", "Source Serif 4", serif; font-weight: 700;
}
html[lang="th"] .kicker { letter-spacing: 0.02em; }
html[lang="th"] body { line-height: 1.65; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

  </style>

  };

  const GROUPS = ["concentrate", "ingredient", "packaging", "energy", "scrap", "sources"];
  let tab = "concentrate";
  let selected = {};
  let energyFreq = "month";
  let chart;

  const $ = (id) => document.getElementById(id);
  const t = (k) => (T[lang] && T[lang][k]) || T.en[k] || k;
  const L = (o, k) => (lang === "th" && o[k + "_th"] != null) ? o[k + "_th"] : o[k];
  const byId = (id) => ITEMS.find((x) => x.id === id);

  function fmtNum(v, nd) {
    if (v == null || Number.isNaN(v)) return "—";
    const n = Number(v);
    let d = nd;
    if (d == null) {
      if (Math.abs(n) >= 1000) d = (Math.abs(n - Math.round(n)) < 0.05 ? 0 : 1);
      else if (Math.abs(n) >= 100) d = 1;
      else d = 2;
    }
    return n.toLocaleString(lang === "th" ? "th-TH" : "en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function shortSrc(it) {
    const s = (it.latest && it.latest.src) || it.src_name || "";
    const cut = s.split(" (ตัวอย่าง")[0].split(" — ")[0].split(" · ")[0];
    return cut.length > 52 ? cut.slice(0, 50).trim() + "…" : cut;
  }
  function lastDefined(arr) {
    for (let i = arr.length - 1; i >= 0; i--) if (arr[i] != null) return { i, v: arr[i] };
    return { i: -1, v: null };
  }
  function pctChange(arr, back) {
    const cur = lastDefined(arr);
    if (cur.i < 0) return null;
    const j = cur.i - back;
    if (j < 0 || arr[j] == null || !arr[j]) return null;
    return (cur.v / arr[j] - 1) * 100;
  }
  function chgHtml(label, p) {
    if (p == null) return "";
    const cls = p > 0.15 ? "up" : p < -0.15 ? "down" : "flat";
    const sign = p > 0 ? "+" : "";
    return `<span class="${cls}">${label} ${sign}${p.toFixed(1)}%</span>`;
  }
  function monthLabel(ym) {
    const [y, m] = ym.split("-").map(Number);
    const en = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const th = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
    return (lang === "th" ? th : en)[m - 1] + " " + y;
  }
  function dayLabel(iso) {
    const [y, m, d] = iso.split("-");
    return (+d) + " " + monthLabel(y + "-" + m).replace(/ \d{4}$/, "");
  }
  function addMonths(ym, n) {
    let [y, m] = ym.split("-").map(Number);
    m += n;
    while (m > 12) { m -= 12; y++; }
    while (m < 1) { m += 12; y--; }
    return y + "-" + String(m).padStart(2, "0");
  }
  function lerp(a, b, t0) { return a + (b - a) * t0; }
  function monthIndex(ym) {
    const [y, m] = ym.split("-").map(Number);
    return y * 12 + (m - 1);
  }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i]").forEach((el) => {
      const k = el.getAttribute("data-i");
      if (k) el.textContent = t(k);
    });
    document.querySelectorAll(".langsw button").forEach((b) => b.classList.toggle("on", b.dataset.l === lang));
    const fx = byId("fx");
    if (fx) {
      $("fxVal").textContent = fmtNum(fx.latest.v, 2);
      $("fxUnit").textContent = L(fx, "name");
      $("fxWhen").textContent = fx.latest.when;
      $("fxSrc").href = fx.latest.href || fx.src_url;
    }
    render();
  }

  function setLang(next) {
    lang = next;
    try { localStorage.setItem(LS, lang); } catch (e) {}
    applyLang();
  }

  function itemsIn(group) { return ITEMS.filter((x) => x.group === group); }

  function accessLabel(a) {
    if (a === "free") return t("access_free");
    if (a === "paid") return t("access_paid");
    return t("access_partial");
  }
  function feasLabel(f) {
    if (f === "yes") return t("feas_yes");
    if (f === "partial") return t("feas_partial");
    return t("feas_no");
  }

  function cardHtml(it) {
    const last = lastDefined(it.d);
    const price = (it.latest && it.latest.v != null) ? it.latest.v : last.v;
    const nd = (it.latest && it.latest.dec != null) ? it.latest.dec : undefined;
    const c1 = chgHtml(t("chg1"), pctChange(it.d, 1));
    const c3 = chgHtml(t("chg3"), pctChange(it.d, 3));
    const c12 = chgHtml(t("chg12"), pctChange(it.d, 12));
    const isSel = selected[tab] === it.id;
    const badges = [];
    if (it.sample && it.latest_is_real) badges.push(`<span class="badge prelim">${t("official_latest")}</span><span class="badge sample">${t("sample")}</span>`);
    else if (it.sample) badges.push(`<span class="badge sample">${t("sample")}</span>`);
    else badges.push(`<span class="badge real">${t("official")}</span>`);
    badges.push(`<span class="badge ${it.access}">${accessLabel(it.access)}</span>`);
    const href = (it.latest && it.latest.href) || it.src_url;
    const srcName = shortSrc(it);
    return `<article class="cwcard${isSel ? " on" : ""}" data-id="${it.id}" role="button" tabindex="0">
      <div class="flags">${badges.join(" ")}</div>
      <div class="top">
        <h3>${L(it, "name")}</h3>
      </div>
      <div class="now">${fmtNum(price, nd)} <span style="font-size:13px;color:var(--muted);font-family:inherit;font-weight:500">${it.latest && it.latest.u ? it.latest.u : it.unit}</span></div>
      <div class="when">${it.latest && it.latest.when ? it.latest.when : ""}</div>
      <div class="chg">${c1}${c3}${c12}</div>
      <div class="spark"><canvas id="sp-${it.id}"></canvas></div>
      <div class="src">${t("source")}: <a href="${href}" target="_blank" rel="noopener">${srcName}</a></div>
    </article>`;
  }

  function spark(it) {
    const el = document.getElementById("sp-" + it.id);
    if (!el || !window.Chart) return;
    const vals = it.d.map((v) => (v == null ? null : v));
    new Chart(el, {
      type: "line",
      data: { labels: MONTHS, datasets: [{ data: vals, borderColor: "#163524", backgroundColor: "transparent", borderWidth: 1.5, pointRadius: 0, tension: 0.2, spanGaps: false }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: { x: { display: false }, y: { display: false } }
      }
    });
  }

  // ----- 12-month projection -----
  function forwardMonths(n) {
    const out = [];
    for (let i = 1; i <= n; i++) out.push(addMonths(MONTHS[MONTHS.length - 1], i));
    return out;
  }

  function residualStd(arr) {
    const xs = arr.filter((v) => v != null);
    if (xs.length < 6) return (xs[xs.length - 1] || 1) * 0.08;
    const rets = [];
    for (let i = 1; i < arr.length; i++) {
      if (arr[i] != null && arr[i - 1]) rets.push(arr[i] / arr[i - 1] - 1);
    }
    if (!rets.length) return xs[xs.length - 1] * 0.08;
    const mean = rets.reduce((a, b) => a + b, 0) / rets.length;
    const v = rets.reduce((a, b) => a + (b - mean) ** 2, 0) / rets.length;
    return Math.sqrt(v);
  }

  function seasonalFactors(arr) {
    const acc = Array.from({ length: 12 }, () => []);
    arr.forEach((v, i) => {
      if (v == null) return;
      const mo = (+MONTHS[i].slice(5)) - 1;
      acc[mo].push(v);
    });
    const means = acc.map((a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
    const have = means.filter((x) => x != null);
    const g = have.length ? have.reduce((a, b) => a + b, 0) / have.length : 1;
    return means.map((m) => (m != null && g ? m / g : 1));
  }

  function interpolateFutures(item, fwd) {
    const f = item.futures;
    const pts = f.labels.map((l, i) => ({ t: monthIndex(l.length === 7 ? l : l), v: f.values[i], l }));
    // labels are YYYY-MM
    const lastH = lastDefined(item.d);
    const lastYm = MONTHS[lastH.i];
    const knots = [{ t: monthIndex(lastYm), v: lastH.v, kind: "hist" }].concat(
      pts.map((p) => ({ t: monthIndex(p.l), v: p.v, kind: "fut" }))
    );
    knots.sort((a, b) => a.t - b.t);
    const lastFut = pts[pts.length - 1];
    const lastFutYm = lastFut.l;
    const mid = [], hi = [], lo = [], kind = [];
    const vol = residualStd(item.d);
    fwd.forEach((ym, i) => {
      const t0 = monthIndex(ym);
      if (t0 <= monthIndex(lastFutYm)) {
        let a = knots[0], b = knots[knots.length - 1];
        for (let k = 0; k < knots.length - 1; k++) {
          if (t0 >= knots[k].t && t0 <= knots[k + 1].t) { a = knots[k]; b = knots[k + 1]; break; }
        }
        const u = (b.t === a.t) ? 0 : (t0 - a.t) / (b.t - a.t);
        const v = lerp(a.v, b.v, u);
        mid.push(v);
        const band = v * Math.max(0.03, vol * Math.sqrt(i + 1) * 1.2);
        hi.push(v + band); lo.push(Math.max(0, v - band));
        kind.push("fut");
      } else {
        // statistical extension beyond last contract
        const stepsPast = t0 - monthIndex(lastFutYm);
        // decay last futures slope toward zero
        const slope = (pts.length >= 2) ? (pts[pts.length - 1].v - pts[pts.length - 2].v) / Math.max(1, monthIndex(pts[pts.length - 1].l) - monthIndex(pts[pts.length - 2].l)) : 0;
        const decay = Math.exp(-0.25 * stepsPast);
        const v = lastFut.v + slope * stepsPast * decay;
        mid.push(v);
        const band = v * Math.max(0.05, vol * Math.sqrt(i + 1) * 1.6);
        hi.push(v + band); lo.push(Math.max(0, v - band));
        kind.push("ext");
      }
    });
    return { mid, hi, lo, kind, futLabel: L(f, "label") };
  }

  function project(item) {
    const fwd = forwardMonths(12);
    const last = lastDefined(item.d);
    const vol = residualStd(item.d);
    const sea = seasonalFactors(item.d);

    if (item.fx_range) {
      const r = item.fx_range;
      const mid = [], hi = [], lo = [], kind = [];
      fwd.forEach((ym) => {
        const t0 = monthIndex(ym);
        const knots = r.labels.map((l, i) => ({ t: monthIndex(l), lo: r.low[i], hi: r.high[i] }));
        let a = knots[0], b = knots[knots.length - 1];
        if (t0 <= knots[0].t) { a = b = knots[0]; }
        else if (t0 >= knots[knots.length - 1].t) { a = b = knots[knots.length - 1]; }
        else {
          for (let k = 0; k < knots.length - 1; k++) {
            if (t0 >= knots[k].t && t0 <= knots[k + 1].t) { a = knots[k]; b = knots[k + 1]; break; }
          }
        }
        const u = (b.t === a.t) ? 0 : (t0 - a.t) / (b.t - a.t);
        const loV = lerp(a.lo, b.lo, u), hiV = lerp(a.hi, b.hi, u);
        lo.push(loV); hi.push(hiV); mid.push((loV + hiV) / 2); kind.push("fut");
      });
      return { fwd, mid, hi, lo, kind, note: L(r, "label") };
    }

    if (item.futures) return Object.assign({ fwd, note: item.futures[lang === "th" ? "label_th" : "label"] }, interpolateFutures(item, fwd));

    const administered = /Administered|ราคาที่ทางการกำหนด/.test(item.method);
    const mid = [], hi = [], lo = [], kind = [];
    const lastV = last.v;
    if (administered) {
      fwd.forEach((ym, i) => {
        mid.push(lastV); // hold scenario as the centre line
        const shock = lastV * (0.06 + 0.01 * i); // widening policy/oil-lag band
        hi.push(lastV + shock);
        lo.push(Math.max(0, lastV - shock));
        kind.push("ext");
      });
      return { fwd, mid, hi, lo, kind };
    }
    // trend + seasonal
    const xs = item.d.map((v, i) => (v != null ? { i, v } : null)).filter(Boolean);
    let drift = 0;
    if (xs.length >= 13) {
      const a = xs[xs.length - 13].v, b = xs[xs.length - 1].v;
      if (a) drift = Math.pow(b / a, 1 / 12) - 1;
    } else if (xs.length >= 2) {
      const a = xs[0].v, b = xs[xs.length - 1].v;
      if (a) drift = Math.pow(b / a, 1 / Math.max(1, xs[xs.length - 1].i - xs[0].i)) - 1;
    }
    // damp drift
    drift = Math.max(-0.03, Math.min(0.03, drift));
    let v = lastV;
    fwd.forEach((ym, i) => {
      const mo = (+ym.slice(5)) - 1;
      const lastMo = (+MONTHS[last.i].slice(5)) - 1;
      const seaRatio = (sea[mo] || 1) / (sea[lastMo] || 1);
      // apply small drift and pull toward seasonal level
      v = v * (1 + drift) * Math.pow(seaRatio, 0.15);
      mid.push(v);
      const band = v * Math.max(0.06, vol * Math.sqrt(i + 1) * 1.7);
      hi.push(v + band);
      lo.push(Math.max(0, v - band));
      kind.push("ext");
    });
    return { fwd, mid, hi, lo, kind };
  }

  function drawMain(it) {
    const el = $("mainChart");
    const note = $("nodaily");
    if (chart) { chart.destroy(); chart = null; }
    if (!it || !el) return;

    const isEnergy = it.group === "energy";
    const freq = isEnergy ? energyFreq : "month";

    if (freq === "day" && it.no_daily) {
      el.parentElement.style.display = "none";
      note.style.display = "block";
      note.textContent = t("nodaily") + " " + L(it, "no_daily");
      return;
    }
    note.style.display = "none";
    el.parentElement.style.display = "";

    let labels, hist, histLabel = t("hist");
    const proj = project(it);

    if (freq === "day" && it.daily) {
      labels = it.daily.labels.map(dayLabel);
      hist = it.daily.d.slice();
      if (it.daily.sample) histLabel = t("hist") + " · " + t("sample");
      // daily view: show last 90 days only, plus a light monthly projection note in the method box
      const datasets = [{
        label: histLabel, data: hist, borderColor: "#163524", backgroundColor: "transparent",
        borderWidth: 1.6, pointRadius: 0, tension: 0.15, spanGaps: false
      }];
      chart = new Chart(el, chartCfg(labels, datasets, it));
      return;
    }
    if (freq === "year" && it.yearly) {
      labels = it.yearly.labels;
      hist = it.yearly.d.slice();
      const datasets = [{
        label: t("hist"), data: hist, borderColor: "#163524", backgroundColor: "rgba(22,53,36,0.08)",
        borderWidth: 2, pointRadius: 3, tension: 0.15, fill: true
      }];
      chart = new Chart(el, chartCfg(labels, datasets, it, true));
      return;
    }

    // monthly + 12m forward
    const histLabels = MONTHS.map(monthLabel);
    const fwdLabels = proj.fwd.map(monthLabel);
    const labelsAll = histLabels.concat(fwdLabels);
    const histData = it.d.concat(Array(proj.fwd.length).fill(null));
    const mid = Array(MONTHS.length).fill(null).concat(proj.mid);
    const hi = Array(MONTHS.length).fill(null).concat(proj.hi);
    const lo = Array(MONTHS.length).fill(null).concat(proj.lo);
    // connect at last history point
    const last = lastDefined(it.d);
    if (last.i >= 0) {
      mid[last.i] = last.v;
      hi[last.i] = last.v;
      lo[last.i] = last.v;
    }
    // split mid into fut vs ext for styling
    const midFut = mid.map((v, i) => {
      if (i < MONTHS.length) return i === last.i ? last.v : null;
      return proj.kind[i - MONTHS.length] === "fut" ? v : (i === MONTHS.length && proj.kind[0] === "fut" ? v : null);
    });
    // ensure continuity: if first fwd is fut, already set; if first is ext, put last hist on ext series
    const midExt = mid.map((v, i) => {
      if (i < MONTHS.length) return i === last.i ? last.v : null;
      return proj.kind[i - MONTHS.length] === "ext" ? v : null;
    });
    // if mixed, also place the last fut point onto ext start
    for (let i = 0; i < proj.kind.length - 1; i++) {
      if (proj.kind[i] === "fut" && proj.kind[i + 1] === "ext") {
        midExt[MONTHS.length + i] = proj.mid[i];
      }
    }

    const datasets = [
      { label: t("band"), data: hi, borderColor: "transparent", backgroundColor: "rgba(36,94,122,0.16)", pointRadius: 0, fill: "+1", tension: 0.2 },
      { label: t("band") + " lo", data: lo, borderColor: "transparent", backgroundColor: "transparent", pointRadius: 0, fill: false, tension: 0.2 },
      { label: t("hist"), data: histData, borderColor: "#163524", backgroundColor: "transparent", borderWidth: 2, pointRadius: 0, tension: 0.15, spanGaps: false },
      { label: t("fut"), data: midFut, borderColor: "#245e7a", backgroundColor: "transparent", borderWidth: 2, borderDash: [6, 4], pointRadius: 0, tension: 0.15, spanGaps: false },
      { label: t("ext"), data: midExt, borderColor: "#6a6a6a", backgroundColor: "transparent", borderWidth: 2, borderDash: [2, 4], pointRadius: 0, tension: 0.15, spanGaps: false }
    ];
    chart = new Chart(el, chartCfg(labelsAll, datasets, it));
  }

  function chartCfg(labels, datasets, it, yearly) {
    return {
      type: "line",
      data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (c) => {
                if (c.dataset.label && c.dataset.label.indexOf(" lo") >= 0) return null;
                const v = c.raw;
                if (v == null) return null;
                return c.dataset.label + ": " + fmtNum(v) + " " + it.unit;
              }
            }
          }
        },
        scales: {
          x: {
            ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: yearly ? 12 : 10, font: { size: 11 }, color: "#5a635a" },
            grid: { color: "rgba(0,0,0,0.04)" }
          },
          y: {
            ticks: { font: { size: 11 }, color: "#5a635a", callback: (v) => fmtNum(v) },
            grid: { color: "rgba(0,0,0,0.06)" },
            title: { display: true, text: it.unit, color: "#5a635a", font: { size: 11 } }
          }
        }
      }
    };
  }

  function sourceTable(list) {
    const rows = list.map((it) => `<tr>
      <td>${L(it, "name")}</td>
      <td><a href="${it.src_url}" target="_blank" rel="noopener">${it.src_name}</a></td>
      <td>${L(it, "freq")}</td>
      <td><span class="badge ${it.access}">${accessLabel(it.access)}</span></td>
      <td><span class="badge ${it.feasible}">${feasLabel(it.feasible)}</span></td>
      <td>${L(it, "notes")}</td>
    </tr>`).join("");
    return `<div class="tablewrap"><table>
      <thead><tr>
        <th>${t("src_item")}</th><th>${t("src_source")}</th><th>${t("src_freq")}</th>
        <th>${t("src_access")}</th><th>${t("src_feas")}</th><th>${t("src_notes")}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
  }

  function uploadBox(list) {
    const need = list.filter((x) => x.needs_upload);
    if (!need.length && tab !== "sources" && tab !== "energy") return "";
    const opts = (need.length ? need : ITEMS.filter((x) => x.needs_upload)).map((x) => `<option value="${x.id}">${L(x, "name")}</option>`).join("");
    return `<div class="upload" id="uploadBox">
      <h3 data-keep>${t("upload_h")}</h3>
      <p class="lead" style="margin-bottom:8px">${t("upload_p")}</p>
      <div class="row">
        <label>${t("upload_name")}<br><input type="text" id="upName" autocomplete="name"></label>
        <label>${t("upload_item")}<br><select id="upItem">${opts}</select></label>
      </div>
      <div class="drop">${t("upload_ph")}<br><input type="file" id="upFile" accept=".csv,text/csv,text/plain" style="margin-top:8px"></div>
      <textarea id="upText" placeholder="${t("upload_ph")}"></textarea>
      <p><button type="button" class="morebtn" id="upBtn">${t("upload_btn")}</button></p>
      <p class="muted" id="upMsg" hidden>${t("upload_ok")}</p>
    </div>`;
  }

  function render() {
    if (chart) { try { chart.destroy(); } catch (e) {} chart = null; }
    if (window.Chart) {
      document.querySelectorAll("canvas").forEach((c) => {
        const inst = Chart.getChart(c);
        if (inst) inst.destroy();
      });
    }
    document.title = t("title") + " — Malee";
    const pane = $("pane");
    if (tab === "sources") {
      $("freqBar").hidden = true;
      pane.innerHTML = `
        <h2>${t("tab_sources")}</h2>
        <p class="lead">${t("lead_sources")}</p>
        ${sourceTable(ITEMS.filter((x) => x.group !== "fx").concat(ITEMS.filter((x) => x.group === "fx")))}
        ${uploadBox(ITEMS)}
        <h2>${t("methods_h")}</h2>
        <div class="grid">
          ${[1,2,3,4,5,6,7].map((n) => `<article class="card" style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px"><h3>${t("m"+n+"h")}</h3><p class="muted" style="margin:0">${t("m"+n+"p")}</p></article>`).join("")}
        </div>`;
      const btn = $("upBtn");
      if (btn) btn.addEventListener("click", () => { $("upMsg").hidden = false; });
      return;
    }

    const list = itemsIn(tab);
    const defaults = { packaging: "kraft", energy: "brent", concentrate: "orange", scrap: "wp_occ" };
    if (!selected[tab]) selected[tab] = defaults[tab] || list[0].id;
    let it = byId(selected[tab]) || list[0];
    selected[tab] = it.id;

    $("freqBar").hidden = tab !== "energy";
    if (tab === "energy") {
      $("freqBar").querySelectorAll("button[data-f]").forEach((b) => b.classList.toggle("on", b.dataset.f === energyFreq));
    }

    let extra = "";
    if (tab === "packaging") {
      extra = `<aside class="callout carton"><h3>${t("carton_h")}</h3><p style="margin:0 0 8px">${t("carton_p")}</p></aside>`;
    }

    pane.innerHTML = `
      <h2>${t("tab_" + tab)}</h2>
      <p class="lead">${t("lead_" + tab)}</p>
      ${extra}
      <div class="detail">
        <div class="chartbox">
          <h3>${t("chart_h")} — ${L(it, "name")}</h3>
          <p class="muted" id="chartSub">${it.latest && it.latest.when ? it.latest.when : ""} · ${it.unit}</p>
          <div class="nodaily" id="nodaily" style="display:none"></div>
          <div class="bigchart"><canvas id="mainChart"></canvas></div>
          <div class="legend">
            <span><i class="hist"></i>${t("hist")}</span>
            <span><i class="fut"></i>${t("fut")}</span>
            <span><i class="ext"></i>${t("ext")}</span>
            <span><i class="band"></i>${t("band")}</span>
          </div>
        </div>
        <div class="methodbox">
          <h3>${t("method_h")}</h3>
          <p>${L(it, "method")}</p>
          <p class="muted">${L(it, "notes")}</p>
          <p class="src">${t("source")}: <a href="${it.src_url}" target="_blank" rel="noopener">${it.src_name}</a></p>
          <div class="caveat">${t("caveat")}</div>
        </div>
      </div>
      <div class="grid" id="cards">${list.map(cardHtml).join("")}</div>
      <h3 style="margin:0 0 8px">${t("tab_sources")}</h3>
      ${sourceTable(list)}
      ${uploadBox(list)}`;

    list.forEach(spark);
    drawMain(it);

    pane.querySelectorAll(".cwcard").forEach((el) => {
      const pick = () => { selected[tab] = el.dataset.id; render(); };
      el.addEventListener("click", pick);
      el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    });
    const btn = $("upBtn");
    if (btn) btn.addEventListener("click", () => { $("upMsg").hidden = false; });
    // packaging: auto-select kraft if arriving first time? keep first item (tin) unless user clicked. OK.
  }

  // tabs
  document.querySelectorAll(".tabbar button").forEach((b) => {
    b.addEventListener("click", () => {
      tab = b.dataset.tab;
      document.querySelectorAll(".tabbar button").forEach((x) => x.classList.toggle("on", x === b));
      applyLang();
    });
  });
  document.querySelectorAll(".langsw button").forEach((b) => {
    b.addEventListener("click", () => setLang(b.dataset.l));
  });
  $("freqBar").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-f]");
    if (!b) return;
    energyFreq = b.dataset.f;
    applyLang();
  });

  applyLang();
})();

  </script>
</body>
</html>
